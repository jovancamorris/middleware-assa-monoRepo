services:
  # ---- 1. Init Container: Ekstrak Skema SQL dari Image ----
  mariadb-init:
    image: ${MI_IMAGE:-registry.assa.id/nobi.sumariga/middleware-assa:1.0.8}
    container_name: mi-mariadb-init
    user: root
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "cp /docker-entrypoint-initdb.d/01_init.sql /init-target/01_init.sql"
    volumes:
      - mariadb_init_script:/init-target

  # ---- 1b. Init Container: Ekstrak Dokumentasi OpenAPI dari Image ----
  doc-init:
    image: ${MI_IMAGE:-registry.assa.id/nobi.sumariga/middleware-assa:1.0.8}
    container_name: mi-doc-init
    user: root
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /doc-target && rm -rf /doc-target/* 2>/dev/null || true; cp -r /app/docs/* /doc-target/"
    volumes:
      - doc_data:/doc-target

  # ---- 2. MariaDB Database (Idempotency & Retry Tracking) ----
  mariadb:
    image: ${DB_IMAGE:-mariadb:11}
    container_name: mi-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ${DB_NAME:-assa_middleware_db}
    ports:
      - "${COMPOSE_DB_PORT:-3308}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Mengambil schema dari shared volume yang diisi oleh mariadb-init:
      - mariadb_init_script:/docker-entrypoint-initdb.d:ro
    depends_on:
      mariadb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---- 3. WSO2 MI Monorepo (Single Image from GitLab Container Registry) ----
  middleware-wso2-api:
    image: ${MI_IMAGE:-registry.assa.id/nobi.sumariga/middleware-assa:1.0.8}
    container_name: middleware-wso2-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
    volumes:
      - ./render-registry-secrets.sh:/home/wso2carbon/render-registry-secrets.sh:ro
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8290 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- 3b. WSO2 API Manager 4.3.0 (Low-Code API GUI, Publisher & DevPortal) ----
  api-manager:
    image: ${APIM_IMAGE:-wso2/wso2am:4.3.0}
    container_name: middleware-wso2-apim
    restart: unless-stopped
    ports:
      - "${APIM_PORT_HTTPS:-9443}:9443"
      - "${APIM_GATEWAY_PORT:-8243}:8243"
    environment:
      - DATABASE_HOST=mariadb
      - DATABASE_PORT=3306
      - APIM_HOSTNAME=${APIM_HOSTNAME:-devmiddleware.assa.id}
      - APIM_PROXY_PORT=${APIM_PROXY_PORT:-443}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        CONF=/home/wso2carbon/wso2am-4.3.0/repository/conf/deployment.toml
        TARGET_HOST="$${APIM_HOSTNAME:-devmiddleware.assa.id}"
        TARGET_PORT="$${APIM_PROXY_PORT:-443}"
        if [ -f "$$CONF" ]; then
          if [ "$$TARGET_HOST" != "localhost" ]; then
            sed -i "s/hostname = \"localhost\"/hostname = \"$$TARGET_HOST\"/g" "$$CONF"
            if ! grep -q "$$TARGET_HOST" "$$CONF"; then
              printf '\n[server]\nhostname = "%s"\n' "$$TARGET_HOST" >> "$$CONF"
            fi
          fi
          if [ -n "$$TARGET_PORT" ] && [ "$$TARGET_PORT" != "9443" ]; then
            if ! grep -q "proxyPort = $$TARGET_PORT" "$$CONF"; then
              printf '\n[transport.https.properties]\nproxyPort = %s\n' "$$TARGET_PORT" >> "$$CONF"
            fi
          fi
        fi
        exec /home/wso2carbon/docker-entrypoint.sh
    volumes:
      - apim_repository_data:/home/wso2carbon/wso2am-4.3.0/repository/data
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9443 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 4. Nginx Reverse Proxy (Satu Pintu Akses HTTP & Docs) ----
  nginx:
    image: nginx:alpine
    container_name: middleware-wso2-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-6030}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - doc_data:/usr/share/nginx/html/docs:ro
    depends_on:
      doc-init:
        condition: service_completed_successfully
      middleware-wso2-api:
        condition: service_started
      api-manager:
        condition: service_started

volumes:
  mariadb_data:
  mariadb_init_script:
  doc_data:
  apim_repository_data:
