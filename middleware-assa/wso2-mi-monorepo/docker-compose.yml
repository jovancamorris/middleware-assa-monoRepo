name: middleware-assa

services:
  mariadb:
    image: ${DB_IMAGE:-mariadb:11}
    container_name: mi-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: assa_middleware_db
    ports:
      - "${COMPOSE_DB_PORT:-3308}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/db/init_mariadb_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  branch-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: branch-service
      args:
        BASE_IMAGE: ${BASE_IMAGE:-wso2/wso2mi:4.6.0}
    image: assa/branch-service:1.0.0
    container_name: branch-service
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "8290:8290"
    environment: &common-env
      DB_HOST: mariadb
      DB_PORT: "3306"
      # Consumed by render-registry-secrets.sh at container start. The dblookup
      # and dbreport mediators read these from registry resources, never from
      # the CAR, so no database credential is committed to the repository.
      DB_USERNAME: "${DB_USERNAME:?set DB_USERNAME in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      SAP_CORE_BASE_URL: ${SAP_CORE_BASE_URL:-https://devsapcoreapi.assa.id}
      SAP_CORE_CUSTOMER_BASE_URL: ${SAP_CORE_CUSTOMER_BASE_URL:-https://sapcoreapi.assa.id}
      ASSA_EXT_BASE_URL: ${ASSA_EXT_BASE_URL:-https://devfmsapi.assa.id}
      # Application registry tokens. No defaults on purpose: the gateway must fail
      # closed rather than authenticate with a token baked into this file.
      AUTH_APP_A_TOKEN: "${AUTH_APP_A_TOKEN:?set AUTH_APP_A_TOKEN in .env}"
      AUTH_APP_B_TOKEN: "${AUTH_APP_B_TOKEN:?set AUTH_APP_B_TOKEN in .env}"
      AUTH_APP_QA_TOKEN: "${AUTH_APP_QA_TOKEN:?set AUTH_APP_QA_TOKEN in .env}"
      AUTH_APP_ATLAS_TOKEN: "${AUTH_APP_ATLAS_TOKEN:?set AUTH_APP_ATLAS_TOKEN in .env}"
      AUTH_APP_OMNICHANNEL_TOKEN: "${AUTH_APP_OMNICHANNEL_TOKEN:?set AUTH_APP_OMNICHANNEL_TOKEN in .env}"
      AUTH_APP_BARANTUM_TOKEN: "${AUTH_APP_BARANTUM_TOKEN:?set AUTH_APP_BARANTUM_TOKEN in .env}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8290 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: customer-service
      args:
        BASE_IMAGE: ${BASE_IMAGE:-wso2/wso2mi:4.6.0}
    image: assa/customer-service:1.0.0
    container_name: customer-service
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "8291:8290"
    environment: *common-env

  vehicle-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: vehicle-service
      args:
        BASE_IMAGE: ${BASE_IMAGE:-wso2/wso2mi:4.6.0}
    image: assa/vehicle-service:1.0.0
    container_name: vehicle-service
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "8292:8290"
    environment:
      <<: *common-env
      ASSA_EXT_VEHICLE_APIKEY: ${ASSA_EXT_VEHICLE_APIKEY:-}

  vendor-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: vendor-service
      args:
        BASE_IMAGE: ${BASE_IMAGE:-wso2/wso2mi:4.6.0}
    image: assa/vendor-service:1.0.0
    container_name: vendor-service
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "8293:8290"
    environment:
      <<: *common-env
      FTP_SAP_HOST: ${FTP_SAP_HOST:-devqaxmlpool.assa.id}
      FTP_SAP_PORT: ${FTP_SAP_PORT:-21}
      FTP_SAP_TARGET: ${FTP_SAP_TARGET:-/vmd}
      FTP_SAP_USERNAME: ${FTP_SAP_USERNAME:-middlewaredev}
      FTP_SAP_PASSWORD: ${FTP_SAP_PASSWORD:-}

  spk-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: spk-service
      args:
        BASE_IMAGE: ${BASE_IMAGE:-wso2/wso2mi:4.6.0}
    image: assa/spk-service:1.0.0
    container_name: spk-service
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "8294:8290"
    environment:
      <<: *common-env
      FTP_SPK_HOST: ${FTP_SPK_HOST:-devqaxmlpool.assa.id}
      FTP_SPK_PORT: ${FTP_SPK_PORT:-21}
      FTP_SPK_TARGET: ${FTP_SPK_TARGET:-/duelist}
      FTP_SPK_USERNAME: ${FTP_SPK_USERNAME:-middlewaredev}
      FTP_SPK_PASSWORD: ${FTP_SPK_PASSWORD:-}

  service-request-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service-request-service
      args:
        BASE_IMAGE: ${BASE_IMAGE:-wso2/wso2mi:4.6.0}
    image: assa/service-request-service:1.0.0
    container_name: service-request-service
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "8295:8290"
    environment:
      <<: *common-env
      ASSA_EXT_SR_BASE_URL: ${ASSA_EXT_SR_BASE_URL:-https://assa-ext-services.assa.id/dev}
      ASSA_EXT_SR_APIKEY: "${ASSA_EXT_SR_APIKEY:?set ASSA_EXT_SR_APIKEY in .env}"
      SR_TARGET_ATLAS_ENABLED: ${SR_TARGET_ATLAS_ENABLED:-false}
      SR_TARGET_ATLAS_BASE_URL: ${SR_TARGET_ATLAS_BASE_URL:-https://fe.atlas-dev.assa.id}
      SR_TARGET_ATLAS_APIKEY: "${SR_TARGET_ATLAS_APIKEY:-}"
      SR_TARGET_EXTSERVICE_ENABLED: ${SR_TARGET_EXTSERVICE_ENABLED:-true}

  payments-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: payments-service
      args:
        BASE_IMAGE: ${BASE_IMAGE:-wso2/wso2mi:4.6.0}
    image: assa/payments-service:1.0.0
    container_name: payments-service
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "8296:8290"
    environment:
      <<: *common-env
      FTP_PAYMENTS_HOST: ${FTP_PAYMENTS_HOST:-devqaxmlpool.assa.id}
      FTP_PAYMENTS_PORT: ${FTP_PAYMENTS_PORT:-21}
      FTP_PAYMENTS_TARGET: ${FTP_PAYMENTS_TARGET:-/payments}
      FTP_PAYMENTS_USERNAME: ${FTP_PAYMENTS_USERNAME:-middlewaredev}
      FTP_PAYMENTS_PASSWORD: "${FTP_PAYMENTS_PASSWORD:?set FTP_PAYMENTS_PASSWORD in .env}"

  nginx:
    image: nginx:alpine
    container_name: middleware-wso2-nginx
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/nginx-entrypoint.sh"]
    ports:
      - "${NGINX_HTTP_PORT:-6031}:80"
    environment:
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-http://localhost:6031}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs:/usr/share/nginx/html/docs:ro
      - ./platform/docker/nginx-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh:ro
    depends_on:
      - branch-service
      - customer-service
      - vehicle-service
      - vendor-service
      - spk-service
      - service-request-service
      - payments-service

volumes:
  mariadb_data:
