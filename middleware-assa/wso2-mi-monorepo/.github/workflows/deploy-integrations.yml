name: Build & Deploy Integrations

# ==============================================================================
# CI/CD Monorepo WSO2 MI
# - Build parent (shared + semua service) sekali untuk validasi.
# - Build & push image Docker per service (matrix).
# - (Opsional) deploy ke Kubernetes memakai platform/k8s/base-deployment.yaml.
# ==============================================================================

on:
  push:
    branches: [ main ]
    paths:
      - "shared/**"
      - "integrations/**"
      - "platform/**"
      - "pom.xml"
      - ".github/workflows/deploy-integrations.yml"
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY }}         # mis. registryassa.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # 1) Validasi build seluruh monorepo (shared + integrations)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Build all modules (aggregator)
        run: mvn -B -ntp clean install -DskipTests

  # 2) Build & push image per service (paralel)
  docker:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - branch-service
          - customer-service
          - vehicle-service
          - vendor-service
          - spk-service
          - service-request-service
    steps:
      - uses: actions/checkout@v4
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: integrations/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest

  # 3) (Opsional) Deploy ke Kubernetes
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    strategy:
      matrix:
        service:
          - branch-service
          - customer-service
          - vehicle-service
          - vendor-service
          - spk-service
          - service-request-service
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
      - name: Render & apply manifest
        run: |
          sed "s/__SERVICE_NAME__/${{ matrix.service }}/g; s#__IMAGE__#${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}#g" \
            platform/k8s/base-deployment.yaml | kubectl apply -f -
          kubectl -n middleware rollout status deploy/${{ matrix.service }} --timeout=180s
