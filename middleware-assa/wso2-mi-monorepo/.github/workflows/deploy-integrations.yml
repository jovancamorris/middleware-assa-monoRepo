name: Build and Deploy Integrations

on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "integrations/**"
      - "platform/**"
      - "scripts/**"
      - "pom.xml"
      - ".github/workflows/deploy-integrations.yml"
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Build existing integrations project
        run: mvn -B -ntp clean install -DskipTests

  docker:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - branch-service
          - customer-service
          - vehicle-service
          - vendor-service
          - spk-service
          - service-request-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Build shared CAR
        run: mvn -B -ntp -pl shared -am install -DskipTests
      - name: Build CAR files for ${{ matrix.service }}
        run: mvn -B -ntp -pl integrations/${{ matrix.service }} -am package -DskipTests
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: integrations/${{ matrix.service }}/deployment/docker
          file: integrations/${{ matrix.service }}/deployment/docker/Dockerfile
          build-args: BASE_IMAGE=wso2/wso2mi:4.6.0
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    strategy:
      matrix:
        service:
          - branch-service
          - customer-service
          - vehicle-service
          - vendor-service
          - spk-service
          - service-request-service
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
      - name: Render and apply manifest
        run: |
          sed "s/__SERVICE_NAME__/${{ matrix.service }}/g; s#__IMAGE__#${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}#g" \
            platform/k8s/base-deployment.yaml | kubectl apply -f -
          kubectl -n middleware rollout status deploy/${{ matrix.service }} --timeout=180s
