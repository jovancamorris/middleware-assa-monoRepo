# ==============================================================================
# ASSA MIDDLEWARE CONFIGURATION — Vendor Service
# ==============================================================================

# SAP Core Base URLs
sap.core.base.url.dev=https://devsapcoreapi.assa.id
sap.core.base.url.prod=https://sapcoreapi.assa.id
sap.core.base.url=https://devsapcoreapi.assa.id
sap.core.customer.base.url=https://sapcoreapi.assa.id

# Vendor Endpoints
sap.api.path.vendor.getByCreateDate=/api/Vendor/GetByCreateDate

# Default Query Parameters
default.companyCode=1000
default.dateStart=2020-01-01
default.dateEnd=2026-10-08
default.page=1
default.perPage=10

# App Registry & Auth
auth.app.app_a.token=
auth.app.app_a.name=Customer and Branch Service Consumer
auth.app.app_a.scopes=branches,customers,vehicles,vendors,service_requests,spk,payments,employees
auth.app.app_b.token=
auth.app.app_b.name=Operations and Fleet Consumer
auth.app.app_b.scopes=vehicles
auth.app.app_qa.token=
auth.app.app_qa.name=QA Automation Consumer
auth.app.app_qa.scopes=branches,customers,vehicles,vendors,service_requests,spk,payments,employees
auth.app.app_atlas.token=
auth.app.app_atlas.name=ATLAS Vendor Consumer
auth.app.app_atlas.scopes=vendors

# Logging & Observability
log.level=INFO
log.structured.format=json

# Resiliency
retry.max.attempts=3
retry.interval.seconds=60

# FTP Configuration (VMD)
ftp.vendor.host=devqaxmlpool.assa.id
ftp.vendor.port=21
ftp.vendor.username=middlewaredev
ftp.vendor.password=
ftp.vendor.remote.dir=/vmd/upload
ftp.vendor.vmd.remote.dir=/vmd/upload
ftp.vendor.upload.remote.dir=/vmd/upload
ftp.vendor.success.remote.dir=/vmd/upload/success
ftp.vendor.failed.remote.dir=/vmd/upload/failed
ftp.vendor.processing.remote.dir=/vmd/upload/processing
ftp.vendor.passive=true
ftp.vendor.protocol=ftp

# ATLAS Vendor Callback Outbound Configuration
atlas.vendor.callback.base.url=https://fe.atlas-dev.assa.id
atlas.vendor.callback.path=/api/vendor/public/callback
atlas.vendor.callback.apikey=
