# ASSA Auth Service Configuration
# Backend Human Capital (HC) LDAP Base URL and Endpoints
hc.base.url=https://devhcbead.assa.id
hc.auth.login.path=/auth/login
hc.findemp.path=/userldap/getbyusername

# Application scopes for Auth API consumers
auth.app.app_a.scopes=branches,customers,vehicles,vendors,service_requests,spk,payments,employees
auth.app.app_qa.scopes=branches,customers,vehicles,vendors,service_requests,spk,payments,employees

# Observability
log.level=INFO
log.structured.format=json
