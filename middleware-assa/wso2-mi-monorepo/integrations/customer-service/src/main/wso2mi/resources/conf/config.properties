# ==============================================================================
# ASSA MIDDLEWARE CONFIGURATION (Single Source of Truth)
# Standar Operasional: Sesuai CLEAN_ARCHITECTURE.md, KONSEP.md, KONSEP_MONITORING.md
# Tidak ada URL backend, path, atau kredensial yang di-hardcode di file XML Synapse.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Base URLs (Backend Hosts)
# ------------------------------------------------------------------------------
# SAP Core Base URLs
sap.core.base.url.dev=https://devsapcoreapi.assa.id
sap.core.base.url.prod=https://sapcoreapi.assa.id

# Default active SAP Core Base URLs
sap.core.base.url=https://devsapcoreapi.assa.id
sap.core.customer.base.url=https://sapcoreapi.assa.id

# ASSA External Services / Vehicle Atlas Base URLs (DEV & QA)
assa.ext.base.url.dev=https://devfmsapi.assa.id
assa.ext.base.url.qa=https://devfmsapi.assa.id
assa.ext.base.url=https://devfmsapi.assa.id
vehicleatlas.base.url=https://devfmsapi.assa.id

# ------------------------------------------------------------------------------
# 2. API Backend Paths
# ------------------------------------------------------------------------------
# Branch Endpoints
sap.api.path.branch.getByCreateDate=/api/Branches/GetByCreateDate

# Customer Endpoints
sap.api.path.customer.getByCreateDate=/api/Customer/GetByCreateDate

# Vehicle / External Service Endpoints (Vehicle Atlas)
assa.api.path.vehicle=/api/vehicleatlas
vehicleatlas.api.path=/api/vehicleatlas

# ------------------------------------------------------------------------------
# 3. External API Credentials / Keys
# ------------------------------------------------------------------------------
# ASSA External Services / Vehicle Atlas API Keys (Configured via .env or System Properties)
assa.ext.vehicle.apikey.dev=
assa.ext.vehicle.apikey.qa=
assa.ext.vehicle.apikey=
vehicleatlas.apikey=

# ------------------------------------------------------------------------------
# 4. Default Query Parameters
# ------------------------------------------------------------------------------
default.companyCode=1000
default.dateStart=2020-01-01
default.dateEnd=2026-09-11
default.page=1
default.perPage=10

# ------------------------------------------------------------------------------
# 5. App Registry (Autentikasi Token per-Aplikasi - KONSEP.md)
# ------------------------------------------------------------------------------
# Format token per app: auth.app.<appId>.token
# Format scopes: auth.app.<appId>.scopes

# Aplikasi A (Customer & Branch Consumer)
auth.app.app_a.token=
auth.app.app_a.name=Customer and Branch Service Consumer
auth.app.app_a.scopes=branches,customers,vehicles,vendors,service_requests,spk

# Aplikasi B (Fleet & Vehicle Service Consumer)
auth.app.app_b.token=
auth.app.app_b.name=Operations and Fleet Consumer
auth.app.app_b.scopes=vehicles

# QA & Testing App
auth.app.app_qa.token=
auth.app.app_qa.name=QA Automation Consumer
auth.app.app_qa.scopes=branches,customers,vehicles,vendors,service_requests,spk

# Aplikasi ATLAS (Vendor VMD Consumer)
auth.app.app_atlas.token=
auth.app.app_atlas.name=ATLAS Vendor Consumer
auth.app.app_atlas.scopes=vendors

# Aplikasi Omnichannel (Service Request Consumer)
auth.app.app_omnichannel.token=
auth.app.app_omnichannel.name=Omnichannel SR Consumer
auth.app.app_omnichannel.scopes=service_requests

# ------------------------------------------------------------------------------
# 6. Observability & Logging
# ------------------------------------------------------------------------------
log.level=INFO
log.structured.format=json

# ------------------------------------------------------------------------------
# 7. Database Connection (MariaDB Local Port 3307)
# ------------------------------------------------------------------------------
db.driver=org.mariadb.jdbc.Driver
db.url=jdbc:mariadb://localhost:3307/assa_middleware_db?useSSL=false&allowPublicKeyRetrieval=true
db.username=root
db.password=

# ------------------------------------------------------------------------------
# 8. Resiliency & 3x Retry Policy (Non-hardcoded) & Asynchronous Queue
# ------------------------------------------------------------------------------
retry.max.attempts=3
retry.interval.seconds=60
retry.worker.interval.seconds=120
retry.worker.enabled=true

# ------------------------------------------------------------------------------
# 9. Vendor Create & Invoice ΓÇö FTP Interface
# ------------------------------------------------------------------------------
ftp.vendor.host=devqaxmlpool.assa.id
ftp.vendor.port=21
ftp.vendor.username=middlewaredev
ftp.vendor.password=
ftp.vendor.remote.dir=/vmd
ftp.vendor.remote.invoice.dir=/duelist
ftp.vendor.passive=true
ftp.vendor.protocol=ftp
ftp.vendor.vmd.remote.dir=/vmd
ftp.vendor.vmd.staging.dir=/vmd/.staging

# ATLAS Header constants (VMD)
atlas.header.id=ATLAS
atlas.header.destinationUser=SAP
atlas.header.key1=ATLAS
atlas.header.key2.vmd=VMD

# ------------------------------------------------------------------------------
# 10. Service Request (SR) ΓÇö Fan-out ke ATLAS & ASSA External Services
# ------------------------------------------------------------------------------
# Target 2: ASSA External Services
assa.ext.sr.base.url=https://assa-ext-services.assa.id/dev
assa.api.path.service_request=/service/input_service_request
assa.ext.sr.apikey=
sr.target.extservice.enabled=true

# Target 1: API ATLAS (dalam pengembangan - toggle disabled default)
sr.target.atlas.enabled=false
sr.target.atlas.base.url=https://atlas-api.assa.id/dev
sr.target.atlas.path=/service-request
sr.target.atlas.apikey=

# ------------------------------------------------------------------------------
# 11. SPK Duelist ΓÇö ATLAS FTP Interface
# ------------------------------------------------------------------------------
ftp.spk.host=devqaxmlpool.assa.id
ftp.spk.port=21
ftp.spk.username=middlewaredev
ftp.spk.password=
ftp.spk.remote.dir=/duelist
ftp.spk.staging.dir=/duelist/.staging
ftp.spk.protocol=ftp
ftp.spk.passive=true
atlas.header.id=ATLAS
atlas.header.destinationUser=SAP
atlas.header.key1=ATLAS
atlas.header.key2.spk=SPK



