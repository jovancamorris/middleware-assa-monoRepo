# Reusable Kubernetes manifest for each existing integration service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SERVICE_NAME__
  namespace: middleware
  labels:
    app: __SERVICE_NAME__
    tier: integration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: __SERVICE_NAME__
  template:
    metadata:
      labels:
        app: __SERVICE_NAME__
        tier: integration
    spec:
      containers:
        - name: __SERVICE_NAME__
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8290 }
            - { name: https, containerPort: 8253 }
            - { name: mgmt, containerPort: 9164 }
          envFrom:
            - configMapRef: { name: middleware-config }
          env:
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: middleware-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: middleware-secret, key: DB_PASSWORD } }
          startupProbe:
            httpGet: { path: /health/__SERVICE_NAME__, port: 8290 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readiness/__SERVICE_NAME__, port: 8290 }
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/__SERVICE_NAME__, port: 8290 }
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "500m", memory: "768Mi" }
            limits: { cpu: "1500m", memory: "1536Mi" }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: __SERVICE_NAME__
  namespace: middleware
  labels:
    app: __SERVICE_NAME__
spec:
  type: ClusterIP
  selector:
    app: __SERVICE_NAME__
  ports:
    - { name: http, port: 8290, targetPort: 8290 }
    - { name: https, port: 8253, targetPort: 8253 }
