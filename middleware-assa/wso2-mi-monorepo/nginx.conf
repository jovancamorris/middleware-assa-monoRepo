# Nginx Reverse Proxy Configuration for ASSA Middleware (Per-Service Routing)
# Gateway Port: 6031 (devmiddleware1.assa.id:6031)

upstream branch_backend {
    server branch-service:8290;
    keepalive 32;
}

upstream customer_backend {
    server customer-service:8290;
    keepalive 32;
}

upstream vehicle_backend {
    server vehicle-service:8290;
    keepalive 32;
}

upstream vendor_backend {
    server vendor-service:8290;
    keepalive 32;
}

upstream spk_backend {
    server spk-service:8290;
    keepalive 32;
}

upstream service_request_backend {
    server service-request-service:8290;
    keepalive 32;
}

server {
    listen 80;
    server_name devmiddleware1.assa.id localhost _;

    client_max_body_size 20m;

    # ==========================================
    # API Documentation & OpenAPI Specification
    # URL: https://devmiddleware1.assa.id/docs
    # ==========================================
    location ^~ /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
        try_files $uri $uri/ /docs/index.html;

        # Header CORS agar spesifikasi OpenAPI dapat diakses oleh frontend
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    location = /docs {
        return 301 /docs/;
    }

    # Redirect /doc to /docs for backward compatibility
    location ^~ /doc {
        return 301 /docs/;
    }

    # ==========================================
    # Health & Readiness Endpoints (Per Service)
    # ==========================================

    # Branch Health & Readiness
    location /health/branch {
        proxy_pass http://branch_backend/health/branch;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readiness/branch {
        proxy_pass http://branch_backend/readiness/branch;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Customer Health & Readiness
    location /health/customer {
        proxy_pass http://customer_backend/health/customer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readiness/customer {
        proxy_pass http://customer_backend/readiness/customer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vehicle Health & Readiness
    location /health/vehicle {
        proxy_pass http://vehicle_backend/health/vehicle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readiness/vehicle {
        proxy_pass http://vehicle_backend/readiness/vehicle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vendor Health & Readiness
    location /health/vendor {
        proxy_pass http://vendor_backend/health/vendor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readiness/vendor {
        proxy_pass http://vendor_backend/readiness/vendor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPK Health & Readiness
    location /health/spk {
        proxy_pass http://spk_backend/health/spk;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readiness/spk {
        proxy_pass http://spk_backend/readiness/spk;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service Request Health & Readiness
    location /health/service-request {
        proxy_pass http://service_request_backend/health/service-request;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readiness/service-request {
        proxy_pass http://service_request_backend/readiness/service-request;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback umum untuk /health dan /readiness
    location /health {
        proxy_pass http://branch_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readiness {
        proxy_pass http://branch_backend/readiness;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # Domain APIs Routing (Per Microservice)
    # ==========================================

    # 1. Branch Service
    location /api/branches/ {
        proxy_pass http://branch_backend/api/branches/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 2. Customer Service
    location /api/customers/ {
        proxy_pass http://customer_backend/api/customers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 3. Vehicle Service
    location /api/vehicles/ {
        proxy_pass http://vehicle_backend/api/vehicles/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 4. Vendor Service
    location /api/vendors/ {
        proxy_pass http://vendor_backend/api/vendors/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 5. SPK Service
    location /api/spk/ {
        proxy_pass http://spk_backend/api/spk/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 6. Service Request & Background Worker Service
    location /api/service-requests/ {
        proxy_pass http://service_request_backend/api/service-requests/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/worker/ {
        proxy_pass http://service_request_backend/api/worker/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Default fallback
    location / {
        proxy_pass http://branch_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}